<div class="form-container">
  <h2>Alta de Producto</h2>
  <form [formGroup]="productoForm" (ngSubmit)="guardar()">
    
    <div class="field">
      <label>Nombre del Producto:</label>
      <input type="text" formControlName="nombre">
      <div *ngIf="productoForm.get('nombre')?.invalid && (productoForm.get('nombre')?.touched || productoForm.get('nombre')?.dirty)" class="error-msg">
        <small *ngIf="productoForm.get('nombre')?.errors?.['required']">El nombre es obligatorio.</small>
        <small *ngIf="productoForm.get('nombre')?.errors?.['minlength']">Debe tener al menos 3 caracteres.</small>
      </div>
    </div>

    <div class="field">
      <label>Categoría:</label>
      <select formControlName="categoria">
        <option value="">Seleccione...</option>
        <option value="1">Electrónica</option>
        <option value="2">Hogar</option>
      </select>
    </div>

    <div class="field">
      <label>Precio:</label>
      <input type="number" formControlName="precio">
    </div>

    <div class="field">
      <label>Descripción:</label>
      <textarea formControlName="descripcion"></textarea>
    </div>

    <div class="field">
      <label>Stock:</label>
      <input type="number" formControlName="stock">
      <div *ngIf="productoForm.get('stock')?.invalid && (productoForm.get('stock')?.touched || productoForm.get('stock')?.dirty)" class="error-msg">
        <small *ngIf="productoForm.get('stock')?.errors?.['required']">El stock es obligatorio.</small>
        <small *ngIf="productoForm.get('stock')?.errors?.['min']">El stock no puede ser negativo.</small>
      </div>
    </div>

    <button type="submit" [disabled]="productoForm.invalid">Guardar Producto</button>

    <hr>
    <p><strong>Estado del Formulario:</strong> {{ productoForm.status }}</p>

  </form>
</div>
